<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
#c{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:'Inter',sans-serif}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,12,0) 42%,rgba(30,26,16,.70) 100%)}
.head{position:absolute;left:60px;right:340px;bottom:150px;font-family:'Fraunces',serif;font-weight:600;font-size:66px;line-height:1.06;color:#fff;text-shadow:0 3px 22px rgba(0,0,0,.42)}
.sub{position:absolute;left:62px;bottom:80px;font-weight:700;font-size:27px;color:#F5EFE2;letter-spacing:.3px;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.bottle{position:absolute;right:40px;bottom:34px;height:500px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.4))}
</style></head><body><div id="c">
  <img id="bg" src="scene_bedroom.png"><div id="shade"></div>
  <div class="head">Lived in your suitcase<br>for a week. Dinner-ready<br>in 60 seconds.</div>
  <div class="sub">Spray. Smooth. Go.</div>
  <img class="bottle" src="bottle_cut.png">
</div></body></html>
