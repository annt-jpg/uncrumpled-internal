<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}#c{width:1080px;height:1080px;position:relative;overflow:hidden;background:#F5EFE2;font-family:'Inter',sans-serif}
.note{position:absolute;left:90px;top:140px;width:470px;background:#F4DE9A;padding:46px 44px;transform:rotate(-4deg);box-shadow:0 22px 40px rgba(40,38,30,.22);font-family:'Caveat',cursive;color:#2C2A24}
.note h4{font-size:54px;margin-bottom:14px}.note ul{list-style:none;font-size:40px;line-height:1.55}.note li{padding-left:6px}
.note li.x{color:#9a8f73}.note li.x span{position:relative}.note li.x span:after{content:"";position:absolute;left:-4px;right:-4px;top:52%;height:4px;background:#B5683E;transform:rotate(-2deg)}
.bottle{position:absolute;right:70px;bottom:96px;height:660px;filter:drop-shadow(0 18px 30px rgba(40,38,30,.3))}
.head{position:absolute;left:90px;bottom:96px;width:540px;font-family:'Fraunces',serif;font-weight:600;font-size:50px;line-height:1.08;color:#2C2A24}
</style></head><body><div id="c">
<img class="bottle" src="bottle_cut.png">
<div class="note"><h4>today:</h4><ul><li>lunches</li><li>uniforms</li><li>gym bag</li><li>reply to teacher</li><li class="x"><span>iron shirts</span></li></ul></div>
<div class="head">One thing crossed off the list. For good.</div>
</div></body></html>
